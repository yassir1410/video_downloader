<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background drop shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    
    <!-- Inner element shadow -->
    <filter id="glyph-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- Main tile gradient (GNOME vibrant blue) -->
    <linearGradient id="base-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>

    <!-- Top highlight gradient -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner screen gradient -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241f31"/>
      <stop offset="100%" stop-color="#14121b"/>
    </linearGradient>

    <!-- Accent disc gradient (Crimson / Coral accent for play/video motif) -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7800"/>
      <stop offset="100%" stop-color="#e01b24"/>
    </linearGradient>
  </defs>

  <!-- 1. Drop shadow base plate -->
  <rect x="12" y="14" width="104" height="104" rx="28" ry="28" fill="#000000" opacity="0.18"/>
  <rect x="12" y="12" width="104" height="104" rx="28" ry="28" fill="url(#base-grad)"/>

  <!-- 2. Top rim highlight for GNOME 3D tile feel -->
  <rect x="12" y="12" width="104" height="104" rx="28" ry="28" fill="none" stroke="url(#highlight)" stroke-width="2"/>

  <!-- 3. Inner media frame / screen -->
  <rect x="22" y="22" width="84" height="66" rx="14" ry="14" fill="url(#screen-grad)"/>
  
  <!-- Subtle screen glare -->
  <path d="M22 34 C22 27.37 27.37 22 34 22 L94 22 C100.63 22 106 27.37 106 34 L106 44 L22 56 Z" fill="#ffffff" opacity="0.05"/>

  <!-- 4. Play button glyph inside media screen -->
  <path d="M54 39 L78 55 L54 71 Z" fill="#ffffff" opacity="0.9" filter="url(#glyph-shadow)"/>

  <!-- 5. Floating Download Badge (Bottom Right) -->
  <!-- Badge shadow -->
  <circle cx="86" cy="88" r="24" fill="#000000" opacity="0.22"/>
  
  <!-- Badge circle (Vibrant action accent) -->
  <circle cx="86" cy="86" r="23" fill="url(#accent-grad)"/>
  <circle cx="86" cy="86" r="23" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Clean Download Arrow inside badge -->
  <g filter="url(#glyph-shadow)">
    <!-- Arrow shaft -->
    <path d="M86 73 L86 92" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Arrow head -->
    <path d="M77 86 L86 95 L95 86" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Tray bar -->
    <path d="M76 99 L96 99" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
